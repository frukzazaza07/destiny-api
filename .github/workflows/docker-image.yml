name: Remote SSH CI/CD

on:
  push:
    branches: [ main, dev ]

jobs:
  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Executing remote ssh commands using password
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY_TO_DESTINY_SERVER }}
          port: 22 # Change if your server uses a custom SSH port
          script: |
            cd /home/${{ secrets.SERVER_USER }}/apps/prod/destiny-api
            git pull
            docker compose --env-file .env -p tarot-destiny-infra -f docker-compose.infra.yml up -d --wait
            docker compose --env-file .env -f docker-compose.yml -f docker-compose.jobs.yml up -d --force-recreate --build

  deploy-dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Executing remote ssh commands using password
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY_TO_DESTINY_SERVER }}
          port: 22 # Change if your server uses a custom SSH port
          script: |
            cd /home/${{ secrets.SERVER_USER }}/apps/dev/destiny-api
            git pull
            docker compose --env-file .env -f docker-compose.dev.yml -f docker-compose.dev.jobs.yml up -d --force-recreate --build

