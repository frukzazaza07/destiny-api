name: Remote SSH CI/CD

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Executing remote ssh commands using password
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY_TO_DESTINY_SERVER }}
          port: 22 # Change if your server uses a custom SSH port
          script: |
            cd /home/${{ secrets.SERVER_USER }}/apps/dooduang
            git pull
            sudo docker compose -f docker-compose.yml -f docker-compose.jobs.yml up -d --force-recreate --build

