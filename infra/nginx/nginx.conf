user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format edge '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" request_time=$request_time';
    access_log /var/log/nginx/access.log edge;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # CORS preflight requests do not consume a caller's request budget.
    map $request_method $rate_limit_key {
        OPTIONS '';
        default $binary_remote_addr;
    }

    # General API traffic may burst briefly. Deep-reading generation is kept
    # deliberately tighter because each cache miss can consume an LLM worker.
    limit_req_zone $rate_limit_key zone=api_per_ip:10m rate=10r/s;
    limit_req_zone $rate_limit_key zone=reading_generation_per_ip:10m rate=10r/m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream api_upstream {
        server api:5000;
        keepalive 16;
    }

    upstream web_upstream {
        server web:3000;
        keepalive 32;
    }

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        limit_req_status 429;
        error_page 429 = @rate_limited;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Apply both the general API budget and the cost-aware generation
        # budget. A short burst permits normal retries without allowing abuse.
        location = /api/readings/generate {
            limit_req zone=api_per_ip burst=20 nodelay;
            limit_req zone=reading_generation_per_ip burst=2 nodelay;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_pass http://api_upstream;
        }

        location ^~ /api/ {
            limit_req zone=api_per_ip burst=20 nodelay;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_pass http://api_upstream;
        }

        location = /health {
            proxy_pass http://api_upstream;
        }

        location = /metrics {
            limit_req zone=api_per_ip burst=20 nodelay;
            proxy_pass http://api_upstream;
        }

        # Swagger is served by ASP.NET only in Development. In Production the
        # upstream returns 404, so the proxy cannot expose interactive docs.
        location = /swagger {
            return 308 /swagger/;
        }

        location ^~ /swagger/ {
            limit_req zone=api_per_ip burst=20 nodelay;
            proxy_pass http://api_upstream;
        }

        location @rate_limited {
            default_type application/json;
            add_header Retry-After "6" always;
            return 429 '{"success":false,"data":null,"error":"Rate limit exceeded. Retry later.","code":429}\n';
        }

        # Locale home pages use directory-style canonical URLs. Other public
        # pages retain the no-trailing-slash convention used in the sitemap.
        location = /en {
            return 308 /en/$is_args$args;
        }

        location = /th {
            return 308 /th/$is_args$args;
        }

        location ~ ^/(?<canonical_path>(?:en|th)/.+)/$ {
            return 308 /$canonical_path$is_args$args;
        }

        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 60s;
            proxy_pass http://web_upstream;
        }
    }
}
