user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format edge '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" request_time=$request_time';

    access_log /var/log/nginx/access.log edge;

    sendfile on;
    keepalive_timeout 65;

    server_tokens off;
    client_max_body_size 1m;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Ignore OPTIONS requests from rate limiting
    map $request_method $rate_limit_key {
        OPTIONS '';
        default $binary_remote_addr;
    }

    limit_req_zone $rate_limit_key zone=api_per_ip:10m rate=10r/s;
    limit_req_zone $rate_limit_key zone=reading_generation_per_ip:10m rate=10r/m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream api_upstream {
        server api:5000;
        keepalive 16;
    }

    upstream web_upstream {
        server web:3000;
        keepalive 32;
    }

    #
    # HTTP
    # Port 80 -> Docker -> 8080
    #
    server {
        listen 8080;
        listen [::]:8080;

        server_name dooduang.cc www.dooduang.cc;

        # Useful for checking nginx without hitting application
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    #
    # HTTPS
    # Port 443 -> Docker -> 8443
    #
    server {
        listen 8443 ssl;
        listen [::]:8443 ssl;

        http2 on;

        server_name dooduang.cc www.dooduang.cc;

        #
        # TLS
        #
        ssl_certificate /etc/letsencrypt/live/dooduang.cc/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dooduang.cc/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        #
        # Basic security headers
        #
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Enable this AFTER HTTPS is confirmed working correctly.
        # add_header Strict-Transport-Security "max-age=31536000" always;

        limit_req_status 429;
        error_page 429 = @rate_limited;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        #
        # Expensive LLM endpoint
        #
        location = /api/readings/generate {
            limit_req zone=api_per_ip burst=20 nodelay;
            limit_req zone=reading_generation_per_ip burst=2 nodelay;

            proxy_read_timeout 120s;
            proxy_send_timeout 120s;

            proxy_pass http://api_upstream;
        }

        #
        # General API
        #
        location ^~ /api/ {
            limit_req zone=api_per_ip burst=20 nodelay;

            proxy_read_timeout 120s;
            proxy_send_timeout 120s;

            proxy_pass http://api_upstream;
        }

        location = /health {
            proxy_pass http://api_upstream;
        }

        #
        # Do NOT expose metrics publicly
        #
        location = /metrics {
            return 404;
        }

        #
        # Do NOT expose Swagger in production
        #
        location = /swagger {
            return 404;
        }

        location ^~ /swagger/ {
            return 404;
        }

        location @rate_limited {
            default_type application/json;

            add_header Retry-After "6" always;

            return 429 '{"success":false,"data":null,"error":"Rate limit exceeded. Retry later.","code":429}\n';
        }

        #
        # Locale canonical URLs
        #
        location = /en {
            return 308 /en/$is_args$args;
        }

        location = /th {
            return 308 /th/$is_args$args;
        }

        location ~ ^/(?<canonical_path>(?:en|th)/.+)/$ {
            return 308 /$canonical_path$is_args$args;
        }

        #
        # Next.js
        #
        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 60s;

            proxy_pass http://web_upstream;
        }
    }
}