name: ${COMPOSE_PROJECT_NAME:-tarot-destiny}

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
  ASPNETCORE_HTTP_PORTS: ${API_PORT:-5000}
  ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
  Postgres__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-tarot_destiny};Username=${POSTGRES_USER:-tarot};Password=${POSTGRES_PASSWORD:-tarot-development-only};Timeout=5;Command Timeout=30
  Redis__ConnectionString: redis:6379,abortConnect=false,connectTimeout=2000,syncTimeout=2000
  Classifier__UseGrpc: "true"
  Classifier__GrpcAddress: http://classifier:50051
  Admin__Key: ${ADMIN_KEY:-tarot-development-admin}
  Account__PublicRegistrationEnabled: ${ACCOUNT_PUBLIC_REGISTRATION:-false}
  Account__BootstrapAdminEmail: ${BOOTSTRAP_ADMIN_EMAIL:-}
  Account__BootstrapAdminPassword: ${BOOTSTRAP_ADMIN_PASSWORD:-}
  Account__DataProtectionKeysPath: /var/lib/tarot-dataprotection
  AccountEmail__Enabled: ${ACCOUNT_EMAIL_ENABLED:-false}
  AccountEmail__Host: ${ACCOUNT_EMAIL_HOST:-}
  AccountEmail__Port: ${ACCOUNT_EMAIL_PORT:-587}
  AccountEmail__UseSsl: ${ACCOUNT_EMAIL_USE_SSL:-true}
  AccountEmail__Username: ${ACCOUNT_EMAIL_USERNAME:-}
  AccountEmail__Password: ${ACCOUNT_EMAIL_PASSWORD:-}
  AccountEmail__FromAddress: ${ACCOUNT_EMAIL_FROM:-}
  AccountEmail__PublicSiteUrl: ${SITE_URL:-http://localhost:3000}
  Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://192.168.1.95:3000}
  DeepReading__AllowUnentitledInDevelopment: ${DEEP_READING_ALLOW_UNENTITLED_IN_DEVELOPMENT:-false}
  RewardedDeep__Enabled: ${REWARDED_DEEP_ENABLED:-false}
  RewardedDeep__Provider: GOOGLE_AD_MANAGER
  RewardedDeep__AdUnitPath: ${REWARDED_DEEP_AD_UNIT_PATH:-}
  LLM__Endpoint: ${TAROT_LLM_CORE_ENDPOINT:-http://host.docker.internal:11434/v1/chat/completions}
  LLM__DefaultTier: ${LLM_DEFAULT_TIER:-PREMIUM}
  LLM__EnableCloudFallback: ${ENABLE_CLOUD_FALLBACK:-false}
  LLM__BypassLocalWorkers: ${BYPASS_LOCAL_LLM:-false}
  LLM__AllowCloudForRequestsWithRawQuestion: ${ALLOW_CLOUD_RAW_QUESTION:-false}
  LLM__Tiers__0__Id: CORE
  LLM__Tiers__0__Model: ${OLLAMA_MODEL:-qwen3:8b}
  LLM__Tiers__0__CacheModelVersion: ${OLLAMA_MODEL:-qwen3:8b}-core-v1
  LLM__Tiers__0__Workers__0__Id: core-gpu-1
  LLM__Tiers__0__Workers__0__Endpoint: ${TAROT_LLM_CORE_ENDPOINT:-http://host.docker.internal:11434/v1/chat/completions}
  LLM__Tiers__0__Workers__0__Model: ${OLLAMA_MODEL:-qwen3:8b}
  LLM__Tiers__0__Workers__0__Provider: LOCAL_GPU
  LLM__Tiers__0__Workers__0__Priority: "0"
  LLM__Tiers__0__Workers__0__MaxConcurrency: "2"
  LLM__Tiers__0__Workers__0__Enabled: "true"
  LLM__Tiers__1__Id: ADVANCED
  LLM__Tiers__1__Model: qwen3:14b
  LLM__Tiers__1__CacheModelVersion: qwen3:14b-advanced-v1
  LLM__Tiers__1__Workers__0__Id: advanced-gpu-1
  LLM__Tiers__1__Workers__0__Endpoint: ${TAROT_LLM_ADVANCED_ENDPOINT:-http://host.docker.internal:11434/v1/chat/completions}
  LLM__Tiers__1__Workers__0__Model: qwen3:14b
  LLM__Tiers__1__Workers__0__Provider: LOCAL_GPU
  LLM__Tiers__1__Workers__0__Priority: "0"
  LLM__Tiers__1__Workers__0__MaxConcurrency: "1"
  LLM__Tiers__1__Workers__0__Enabled: "true"
  LLM__Tiers__2__Id: PREMIUM
  LLM__Tiers__2__Model: CloudModel
  LLM__Tiers__2__CacheModelVersion: premium-v1
  # LLM__Tiers__2__Workers__0__Id: premium-gpu-1
  # LLM__Tiers__2__Workers__0__Endpoint: ${TAROT_LLM_PREMIUM_ENDPOINT:-http://host.docker.internal:11434/v1/chat/completions}
  # LLM__Tiers__2__Workers__0__Model: qwen3:32b
  # LLM__Tiers__2__Workers__0__Provider: LOCAL_GPU
  # LLM__Tiers__2__Workers__0__Priority: "0"
  # LLM__Tiers__2__Workers__0__MaxConcurrency: "1"
  # LLM__Tiers__2__Workers__0__Enabled: "true"
  LLM__Tiers__2__Workers__0__Id: premium-cloud-1
  LLM__Tiers__2__Workers__0__Endpoint: ${TAROT_LLM_CLOUD_ENDPOINT:-https://disabled.invalid/v1/chat/completions}
  LLM__Tiers__2__Workers__0__Model: ${TAROT_LLM_CLOUD_MODEL:-qwen3.8-flash}
  LLM__Tiers__2__Workers__0__Provider: CLOUD_GPU
  LLM__Tiers__2__Workers__0__Priority: "100"
  LLM__Tiers__2__Workers__0__MaxConcurrency: "10"
  LLM__Tiers__2__Workers__0__ApiKey: ${TAROT_LLM_CLOUD_API_KEY:-}
  LLM__Tiers__2__Workers__0__Enabled: ${ENABLE_CLOUD_FALLBACK:-false}

services:
  classifier:
    build:
      context: .
      dockerfile: apps/classifier/Dockerfile
    environment:
      CLASSIFIER_PORT: "50051"
      CLASSIFIER_MODEL_PATH: /workspace/apps/classifier/artifacts/classifier.joblib
    volumes:
      # Version the persistent model volume with the artifact schema. Reusing an
      # older volume masks the model baked into the image and prevents startup.
      - classifier-artifacts-v3:/workspace/apps/classifier/artifacts
    networks:
      - backend
    healthcheck:
      test: [ "CMD", "python", "scripts/health_check.py" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: [ "--migrate" ]
    environment: *api-environment
    networks:
      - backend
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: *api-environment
    expose:
      - ${API_PORT:-5000}
    volumes:
      - account-dataprotection:/var/lib/tarot-dataprotection
    depends_on:
      migrate:
        condition: service_completed_successfully
      classifier:
        condition: service_healthy
    networks:
      - edge
      - backend
    healthcheck:
      test: [ "CMD", "curl", "--fail", "--silent", "http://127.0.0.1:${API_PORT:-5000}/health" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    init: true
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: ${WEB_PORT:-3000}
      SITE_URL: ${SITE_URL:-http://localhost:${WEB_PORT:-3000}}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      ADSENSE_CLIENT_ID: ${ADSENSE_CLIENT_ID:-}
      ADSENSE_GUIDE_SLOT_ID: ${ADSENSE_GUIDE_SLOT_ID:-}
      ADSENSE_ENABLED: ${ADSENSE_ENABLED:-false}
      GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:-}
      ANALYTICS_ENABLED: ${ANALYTICS_ENABLED:-false}
      REWARDED_DEEP_ENABLED: ${REWARDED_DEEP_ENABLED:-false}
      CF_IPCOUNTRY_TRUSTED: ${CF_IPCOUNTRY_TRUSTED:-false}
    expose:
      - ${WEB_PORT:-3000}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: [ "CMD-SHELL", "wget --quiet --output-document=- http://127.0.0.1:${WEB_PORT:-3000}/ >/dev/null" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    init: true
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.11.4
    profiles: [ "local-gpu" ]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - backend
      - egress
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    gpus:
      - driver: nvidia
        count: all
    restart: unless-stopped

  ollama-model-init:
    image: ollama/ollama:0.11.4
    profiles: [ "local-gpu" ]
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        for model in ${OLLAMA_MODELS:-qwen3:8b}; do
          ollama pull "$${model}" || exit 1
        done
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

  inference-external-check:
    image: curlimages/curl:8.12.1
    profiles: [ "external-gpu" ]
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - curl --fail --silent --show-error "${TAROT_EXTERNAL_LLM_HEALTH_URL:-http://host.docker.internal:11434/api/tags}" >/dev/null
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend
      - egress
    restart: "no"

networks:
  edge:
    external: true
    name: ${APP_EDGE_NETWORK:-tarot-destiny_edge}
  egress:
  backend:
    external: true
    name: ${APP_BACKEND_NETWORK:-tarot-destiny_backend}

volumes:
  classifier-artifacts-v3:
  ollama-models:
  account-dataprotection:
