services:
  classifier:
    build:
      context: .
      dockerfile: apps/classifier/Dockerfile
    container_name: tarot-destiny-classifier
    ports:
      - "127.0.0.1:50051:50051"
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: tarot-destiny-postgres
    environment:
      POSTGRES_USER: tarot
      POSTGRES_PASSWORD: tarot
      POSTGRES_DB: tarot_destiny
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: tarot-destiny-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
