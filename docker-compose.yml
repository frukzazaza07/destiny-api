name: ${COMPOSE_PROJECT_NAME:-tarot-destiny}

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
  ASPNETCORE_HTTP_PORTS: "5000"
  Postgres__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-tarot_destiny};Username=${POSTGRES_USER:-tarot};Password=${POSTGRES_PASSWORD:-tarot-development-only};Timeout=5;Command Timeout=30
  Redis__ConnectionString: redis:6379,abortConnect=false,connectTimeout=2000,syncTimeout=2000
  Classifier__UseGrpc: "true"
  Classifier__GrpcAddress: http://classifier:50051
  Admin__Key: ${ADMIN_KEY:-tarot-development-admin}
  Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
  DeepReading__AllowUnentitledInDevelopment: "true"
  LLM__Endpoint: ${TAROT_LLM_CORE_ENDPOINT:-http://ollama:11434/v1/chat/completions}
  LLM__DefaultTier: CORE
  LLM__EnableCloudFallback: ${ENABLE_CLOUD_FALLBACK:-false}
  LLM__AllowCloudForRequestsWithRawQuestion: ${ALLOW_CLOUD_RAW_QUESTION:-false}
  LLM__Tiers__0__Id: CORE
  LLM__Tiers__0__Model: ${OLLAMA_MODEL:-qwen3:8b}
  LLM__Tiers__0__CacheModelVersion: ${OLLAMA_MODEL:-qwen3:8b}-core-v1
  LLM__Tiers__0__Workers__0__Id: core-gpu-1
  LLM__Tiers__0__Workers__0__Endpoint: ${TAROT_LLM_CORE_ENDPOINT:-http://ollama:11434/v1/chat/completions}
  LLM__Tiers__0__Workers__0__Model: ${OLLAMA_MODEL:-qwen3:8b}
  LLM__Tiers__0__Workers__0__Provider: LOCAL_GPU
  LLM__Tiers__0__Workers__0__Priority: "0"
  LLM__Tiers__0__Workers__0__MaxConcurrency: "2"
  LLM__Tiers__0__Workers__0__Enabled: "true"
  LLM__Tiers__1__Id: ADVANCED
  LLM__Tiers__1__Model: qwen3:14b
  LLM__Tiers__1__CacheModelVersion: qwen3:14b-advanced-v1
  LLM__Tiers__1__Workers__0__Id: advanced-gpu-1
  LLM__Tiers__1__Workers__0__Endpoint: ${TAROT_LLM_ADVANCED_ENDPOINT:-http://ollama:11434/v1/chat/completions}
  LLM__Tiers__1__Workers__0__Model: qwen3:14b
  LLM__Tiers__1__Workers__0__Provider: LOCAL_GPU
  LLM__Tiers__1__Workers__0__Priority: "0"
  LLM__Tiers__1__Workers__0__MaxConcurrency: "1"
  LLM__Tiers__1__Workers__0__Enabled: "true"
  LLM__Tiers__2__Id: PREMIUM
  LLM__Tiers__2__Model: qwen3:32b
  LLM__Tiers__2__CacheModelVersion: qwen3:32b-premium-v1
  LLM__Tiers__2__Workers__0__Id: premium-gpu-1
  LLM__Tiers__2__Workers__0__Endpoint: ${TAROT_LLM_PREMIUM_ENDPOINT:-http://ollama:11434/v1/chat/completions}
  LLM__Tiers__2__Workers__0__Model: qwen3:32b
  LLM__Tiers__2__Workers__0__Provider: LOCAL_GPU
  LLM__Tiers__2__Workers__0__Priority: "0"
  LLM__Tiers__2__Workers__0__MaxConcurrency: "1"
  LLM__Tiers__2__Workers__0__Enabled: "true"
  LLM__Tiers__2__Workers__1__Id: premium-cloud-1
  LLM__Tiers__2__Workers__1__Endpoint: ${TAROT_LLM_CLOUD_ENDPOINT:-https://disabled.invalid/v1/chat/completions}
  LLM__Tiers__2__Workers__1__Model: qwen3:32b
  LLM__Tiers__2__Workers__1__Provider: CLOUD_GPU
  LLM__Tiers__2__Workers__1__Priority: "100"
  LLM__Tiers__2__Workers__1__MaxConcurrency: "2"
  LLM__Tiers__2__Workers__1__ApiKey: ${TAROT_LLM_CLOUD_API_KEY:-}
  LLM__Tiers__2__Workers__1__Enabled: ${ENABLE_CLOUD_FALLBACK:-false}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tarot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tarot-development-only}
      POSTGRES_DB: ${POSTGRES_DB:-tarot_destiny}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  classifier:
    build:
      context: .
      dockerfile: apps/classifier/Dockerfile
    environment:
      CLASSIFIER_PORT: "50051"
      CLASSIFIER_MODEL_PATH: /workspace/apps/classifier/artifacts/classifier.joblib
    volumes:
      - classifier-artifacts:/workspace/apps/classifier/artifacts
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "scripts/health_check.py"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["--migrate"]
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: *api-environment
    ports:
      - "127.0.0.1:${API_PORT:-5000}:5000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      classifier:
        condition: service_healthy
    networks:
      - edge
      - backend
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    init: true
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --output-document=- http://127.0.0.1:3000/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    init: true
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.11.4
    profiles: ["local-gpu"]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - backend
      - egress
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    gpus:
      - driver: nvidia
        count: all
    restart: unless-stopped

  ollama-model-init:
    image: ollama/ollama:0.11.4
    profiles: ["local-gpu"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for model in ${OLLAMA_MODELS:-qwen3:8b}; do
          ollama pull "$${model}" || exit 1
        done
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

  inference-external-check:
    image: curlimages/curl:8.12.1
    profiles: ["external-gpu"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - curl --fail --silent --show-error "${TAROT_EXTERNAL_LLM_HEALTH_URL:-http://host.docker.internal:11434/api/tags}" >/dev/null
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend
      - egress
    restart: "no"

networks:
  edge:
  egress:
  backend:
    internal: true

volumes:
  postgres-data:
  redis-data:
  classifier-artifacts:
  ollama-models:
